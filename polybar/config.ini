; Polybar configuration: one file per bar and module, included below.
; See https://github.com/polybar/polybar/wiki

[colors]
; Generated by bin/theme from the active theme, not versioned
include-file = ~/.config/polybar/colors/theme.generated

[global/wm]
margin-bottom = 0

margin-top = 0

[settings]

screenchange-reload = true

compositing-background = over
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

; Bars, started by launch.sh: top on the primary monitor (top-nobacklight
; when the laptop panel is off), secondary on the others
[bar/top]
include-file = ~/.config/polybar/bars/top

[bar/top-nobacklight]
inherit = bar/top
modules-right = info-redshift-temp volume mic xkeyboard memory cpu temperature battery powermenu

[bar/secondary]
include-file = ~/.config/polybar/bars/secondary

[module/backlight]
include-file = ~/.config/polybar/modules/backlight

[module/battery]
include-file = ~/.config/polybar/modules/battery

[module/cpu]
include-file = ~/.config/polybar/modules/cpu

[module/date]
include-file = ~/.config/polybar/modules/date

[module/i3]
include-file = ~/.config/polybar/modules/i3

[module/mic]
include-file = ~/.config/polybar/custom/mic

[module/memory]
include-file = ~/.config/polybar/modules/memory

[module/powermenu]
include-file = ~/.config/polybar/custom/powermenu

[module/wireless-network]
include-file = ~/.config/polybar/modules/wireless-network

[module/info-redshift-temp]
include-file = ~/.config/polybar/custom/redshift

[module/temperature]
include-file = ~/.config/polybar/modules/temperature

[module/volume]
include-file = ~/.config/polybar/modules/pulseaudio

[module/xkeyboard]
include-file = ~/.config/polybar/modules/xkeyboard
